esponse.ok)throw Error('تعذر تغيير كلمة المرور. ربما انتهت صلاحية الرابط.');form.hidden=true;status.textContent='تم تغيير كلمة المرور. يمكنك تسجيل الدخول الآن.'}catch(e){status.textContent=e.message}});</script></body></html>
